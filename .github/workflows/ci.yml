name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import every module
        # A NameError inside a function body survives import, so this is a
        # floor, not a ceiling — the scenario job below is what catches those.
        run: |
          python -c "
          import pathlib, importlib, sys
          sys.path.insert(0, 'src')
          for p in sorted(pathlib.Path('src/vra').glob('*.py')):
              if p.stem != '__init__':
                  importlib.import_module(f'vra.{p.stem}')
          print('all modules import')
          "

      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v

  scenario:
    # The unit suite can be green while the product is broken. This runs the
    # documented sandbox path end to end and asserts on exit codes, which is
    # what a silent all-green regression actually looks like.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: v1 baseline must be clean (exit 0)
        run: |
          set +e
          python3 vra.py --offline --snapshot v1
          code=$?
          set -e
          echo "v1 exit=$code"
          if [ "$code" -ne 0 ]; then
            echo "::error::v1 baseline should exit 0 (clean), got $code"
            exit 1
          fi

      - name: v2 planted change must raise criticals (exit 1)
        run: |
          set +e
          python3 vra.py --offline --snapshot v2 | tee /tmp/v2.log
          code=${PIPESTATUS[0]}
          set -e
          echo "v2 exit=$code"
          if [ "$code" -ne 1 ]; then
            echo "::error::v2 should exit 1 (open critical), got $code"
            exit 1
          fi
          for control in AIV-07 NHI-01 AIV-03; do
            grep -q "CRITICAL $control" /tmp/v2.log || {
              echo "::error::v2 did not raise $control"; exit 1; }
          done

      - name: No vendor may fail to assess
        run: |
          python3 - <<'PY'
          import json, sys
          blob = json.load(open("out/latest.json"))
          failed = blob.get("failed_vendors") or []
          if failed:
              for f in failed:
                  print(f"::error::vendor not assessed: {f['vendor']}: {f['error']}")
              sys.exit(1)
          print("every vendor assessed")
          PY

  cip-scenario:
    # Same reasoning as the scenario job above, for the NERC module. The
    # assertions that matter are the negative ones: exactly one package may
    # fail, and it must be the planted one. A detector that fires on two is
    # producing false positives, and one that fires on none is dead.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fixtures must regenerate byte-for-byte
        # The estate is generated, not committed. If generation drifts, every
        # hash and signature in the repo silently stops matching the artifacts.
        run: |
          python3 vra.py cip build-fixtures --date 2026-09-20
          if ! git diff --quiet -- sandbox/grid; then
            echo "::error::regenerating fixtures changed committed files"
            git --no-pager diff --stat -- sandbox/grid
            exit 1
          fi
          echo "fixtures reproduce exactly"

      - name: Assessment must exit 1 and flag the planted package
        run: |
          set +e
          python3 vra.py cip --date 2026-09-20 --evidence --no-color | tee /tmp/cip.log
          code=${PIPESTATUS[0]}
          set -e
          echo "cip exit=$code"
          if [ "$code" -ne 1 ]; then
            echo "::error::cip run should exit 1 (open critical), got $code"
            exit 1
          fi
          grep -q "FIRMWARE VERIFICATION FAILED  SPS-421-4.7.2" /tmp/cip.log || {
            echo "::error::planted package SPS-421-4.7.2 was not flagged"; exit 1; }

      - name: Negative control — exactly one package may fail
        run: |
          failures=$(grep -c "FIRMWARE VERIFICATION FAILED" /tmp/cip.log || true)
          echo "packages failing verification: $failures"
          if [ "$failures" -ne 1 ]; then
            echo "::error::expected exactly 1 failing package, got $failures"
            exit 1
          fi

      - name: The planted package must pass the hash check
        # If this stops being true the demo has lost its argument: the whole
        # point is that a hash-only process returns green on this package.
        run: |
          python3 - <<'PY'
          import json, sys
          pack = json.load(open("out/cip/evidence-pack.json"))
          row = next(v for v in pack["verification_log"] if v["package_id"] == "SPS-421-4.7.2")
          if not row["hash_match"]:
              print("::error::planted package no longer passes the hash check"); sys.exit(1)
          if row["signature_verified"]:
              print("::error::planted package signature unexpectedly verifies"); sys.exit(1)
          if row["integrity_verified"] or row["source_identity_verified"]:
              print("::error::CIP-010 R1.6 should not be satisfied"); sys.exit(1)
          print("hash MATCH, signature INVALID, R1.6 not satisfied — as designed")
          PY

      - name: Evidence pack must not claim compliance
        run: |
          python3 - <<'PY'
          import pathlib, sys
          text = (pathlib.Path("out/cip/evidence-pack.md").read_text()
                  + pathlib.Path("out/cip/evidence-pack.html").read_text()).lower()
          for phrase in ("is compliant", "fully compliant", "compliance achieved"):
              if phrase in text:
                  print(f"::error::evidence pack asserts compliance: {phrase!r}"); sys.exit(1)
          if "synthetic" not in text:
              print("::error::evidence pack does not declare the data synthetic"); sys.exit(1)
          print("pack states what was checked, not that anyone is compliant")
          PY

  cip-onboarding:
    # The end-to-end path: a vendor arrives as documents and leaves as a scored
    # record. The assertions are mostly about what the tool REFUSED to conclude,
    # because producing findings from a contract is easy and declining to
    # produce one you cannot evidence is the actual product.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Onboard a vendor end to end
        run: |
          set +e
          python3 vra.py cip onboard \
            --vendor "Kestrel Grid Systems" \
            --docs sandbox/procurement/kestrel-grid \
            --offline --date 2026-09-21 --no-color | tee /tmp/onboard.log
          code=${PIPESTATUS[0]}
          set -e
          echo "onboard exit=$code"
          if [ "$code" -ne 1 ]; then
            echo "::error::onboarding should exit 1 (the tampered release is critical), got $code"
            exit 1
          fi

      - name: SHA-256 then Ed25519, with both outcomes present
        run: |
          grep -q "ACCEPTED  KG-RTU-100-2.4.0" /tmp/onboard.log || {
            echo "::error::the genuine release was not accepted"; exit 1; }
          grep -q "REJECTED  KG-RTU-100-2.4.1" /tmp/onboard.log || {
            echo "::error::the substituted release was not rejected"; exit 1; }
          grep -q "computed SHA-256" /tmp/onboard.log || {
            echo "::error::no SHA-256 was computed"; exit 1; }
          grep -q "Ed25519 verify" /tmp/onboard.log || {
            echo "::error::no Ed25519 verification was performed"; exit 1; }

      - name: The code must refuse the two claims it cannot stand behind
        # Rule 1 (absence cannot be evidenced) and rule 2 (a verified extraction
        # may not raise a critical alone). If either stops firing, the safety
        # boundary is gone and the run still looks green.
        run: |
          grep -q "access_termination_notice_clause" /tmp/onboard.log || {
            echo "::error::R1.2.3 absence was not surfaced"; exit 1; }
          grep -qi "An absence has no text to quote" /tmp/onboard.log || {
            echo "::error::rule 1 (absence is not a failure) did not apply"; exit 1; }
          grep -qi "drives a critical control" /tmp/onboard.log || {
            echo "::error::rule 2 (critical ceiling) did not apply"; exit 1; }

      - name: Every quote the model offered must be located in a document
        run: |
          if grep -q "UNVERIFIED" /tmp/onboard.log; then
            echo "::error::a claim was offered with a quote that is not in the source"
            exit 1
          fi
          echo "all offered quotes verified against the source documents"
