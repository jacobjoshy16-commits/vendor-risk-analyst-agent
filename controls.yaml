# Vendor AI *feature* control set — companion to nhi_controls.yaml.
#
# NHI-* scores the identity. AIV-* scores the agentic feature that identity
# powers. Primary frameworks are NIST SP 800-53 Rev. 5 and SOC 2 TSC.
#
# DELIBERATELY SMALL. This set was trimmed from fifteen controls to four when
# NERC CIP became the product identity (see cip_controls.yaml, which is the
# load-bearing set). What was dropped was healthcare-specific (clinical bias
# testing) or SaaS-governance detail (retention schedules, tenant disable
# switches, model-change notices) that a utility is not audited on. What
# remains is the part that bears on a vendor agent operating against an
# estate: who the model provider is, whether it is covered by an agreement,
# whether the agent acts without review, and whether it has been tested
# against adversarial input.
#
# Growing this set back is a decision, not a default. tests/test_vra.py
# bounds its size so drift is caught.
#
# Evaluation semantics (src/vra/evaluate.py), deterministic:
#
#   fails_when:  ALL must hold (AND) for the control to FAIL.
#   gap_when:    ANY holds AND the control does not already fail → gap.
#   severity:    from this file only. The model never sets it.
#
# Condition operators: equals, not_equals, in, not_in, is_unknown, gt, lt,
#                      not_in_baa_scope, truthy, falsy, contains_any

- id: AIV-01
  question: >
    Has the vendor disclosed which model provider processes customer data for
    each AI feature?
  frameworks:
    - { name: "NIST SP 800-53", id: "SA-9" }
    - { name: "NIST SP 800-53", id: "SR-3" }
    - { name: "SOC 2 TSC", id: "CC9.2" }
  # "undisclosed" is an unknown token. Non-disclosure is a gap, never a failure.
  gap_when:
    - field: model_provider
      is_unknown: true
  severity: high
  remediation: >
    Require the vendor to name every model provider processing customer data as
    a condition of continued use, in writing, with 30 days' notice of change.
  compensating_control: >
    Disable the AI feature for regulated workloads until the provider is named.

- id: AIV-03
  question: >
    Is every model provider processing customer data named as a subprocessor and
    covered by an executed downstream processing agreement (BAA or DPA)?
  frameworks:
    - { name: "NIST SP 800-53", id: "SA-9" }
    - { name: "NIST SP 800-53", id: "CA-3" }
    - { name: "SOC 2 TSC", id: "CC9.2" }
  fails_when:
    - field: model_provider
      not_in_baa_scope: true
  severity: critical
  remediation: >
    Obtain an executed BAA or DPA covering the named model provider before any
    customer data is processed by the feature, or obtain written confirmation
    the provider receives no customer data.
  compensating_control: >
    Disable the affected AI feature at the tenant level pending agreement execution.

- id: AIV-07
  question: >
    Does any vendor agent take autonomous action on production records
    (identity, customer, or clinical) without human review?
  frameworks:
    - { name: "NIST SP 800-53", id: "AC-3" }
    - { name: "NIST SP 800-53", id: "AC-6" }
    - { name: "SOC 2 TSC", id: "CC6.1" }
    - { name: "SOC 2 TSC", id: "CC6.3" }
  fails_when:
    - field: autonomy
      equals: acts
    - field: human_in_loop
      equals: false
  severity: critical
  remediation: >
    Disable autonomous action mode until per-action human approval is available,
    or restrict the agent to a read-only scope.
  compensating_control: >
    Scope the agent to non-privileged groups and alert on every agent-attributed
    write in the SIEM within one business day.

- id: AIV-11
  question: >
    Has the vendor tested AI features against prompt injection and adversarial
    input, and will it share results?
  frameworks:
    - { name: "NIST SP 800-53", id: "SI-10" }
    - { name: "NIST SP 800-53", id: "SA-11" }
    - { name: "SOC 2 TSC", id: "CC7.1" }
    - { name: "OWASP LLM Top 10", id: "LLM01" }
  fails_when:
    - field: prompt_injection_tested
      equals: false
  gap_when:
    - field: prompt_injection_tested
      is_unknown: true
  severity: high
  remediation: >
    Obtain a summary of adversarial testing scope and findings, or an
    independent assessment, before the feature is granted write access.
  compensating_control: >
    Restrict agent write scopes and require human approval on privileged actions.
