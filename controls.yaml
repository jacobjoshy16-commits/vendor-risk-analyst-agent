# Vendor AI *feature* control set — companion to nhi_controls.yaml.
#
# NHI-* scores the identity. AIV-* scores the agentic feature that identity
# powers. Primary frameworks are NIST SP 800-53 Rev. 5 and SOC 2 TSC.
# HIPAA citations are optional extras for covered-entity customers; they are
# not the product identity.
#
# Evaluation semantics (src/vra/evaluate.py), deterministic:
#
#   fails_when:  ALL must hold (AND) for the control to FAIL.
#   gap_when:    ANY holds AND the control does not already fail → gap.
#   severity:    from this file only. The model never sets it.
#
# Condition operators: equals, not_equals, in, not_in, is_unknown, gt, lt,
#                      not_in_baa_scope, truthy, falsy, contains_any

- id: AIV-01
  question: >
    Has the vendor disclosed which model provider processes customer data for
    each AI feature?
  frameworks:
    - { name: "NIST SP 800-53", id: "SA-9" }
    - { name: "NIST SP 800-53", id: "SR-3" }
    - { name: "SOC 2 TSC", id: "CC9.2" }
  # "undisclosed" is an unknown token. Non-disclosure is a gap, never a failure.
  gap_when:
    - field: model_provider
      is_unknown: true
  severity: high
  remediation: >
    Require the vendor to name every model provider processing customer data as
    a condition of continued use, in writing, with 30 days' notice of change.
  compensating_control: >
    Disable the AI feature for regulated workloads until the provider is named.

- id: AIV-02
  question: >
    Is an AI-specific addendum executed with the vendor covering AI feature use
    of customer data?
  frameworks:
    - { name: "NIST SP 800-53", id: "SA-9" }
    - { name: "NIST SP 800-53", id: "SA-4" }
    - { name: "SOC 2 TSC", id: "CC9.2" }
  fails_when:
    - field: contract.ai_addendum_signed
      equals: false
  severity: medium
  remediation: >
    Route the vendor's AI addendum to Legal for execution at the next contract
    touchpoint, or sooner if the AI surface has changed.
  compensating_control: >
    Rely on existing DPA / BAA AI clauses; document the delta in the risk register.

- id: AIV-03
  question: >
    Is every model provider processing customer data named as a subprocessor and
    covered by an executed downstream processing agreement (BAA or DPA)?
  frameworks:
    - { name: "NIST SP 800-53", id: "SA-9" }
    - { name: "NIST SP 800-53", id: "CA-3" }
    - { name: "SOC 2 TSC", id: "CC9.2" }
  fails_when:
    - field: model_provider
      not_in_baa_scope: true
  severity: critical
  remediation: >
    Obtain an executed BAA or DPA covering the named model provider before any
    customer data is processed by the feature, or obtain written confirmation
    the provider receives no customer data.
  compensating_control: >
    Disable the affected AI feature at the tenant level pending agreement execution.

- id: AIV-04
  question: >
    Does the vendor use customer data to train, retrain, or fine-tune models?
  frameworks:
    - { name: "NIST SP 800-53", id: "SI-12" }
    - { name: "NIST SP 800-53", id: "AC-4" }
    - { name: "SOC 2 TSC", id: "CC6.1" }
  fails_when:
    - field: training_on_customer_data
      equals: true
  gap_when:
    - field: training_on_customer_data
      is_unknown: true
  severity: high
  remediation: >
    Exercise the contractual opt-out from model training on customer data and
    obtain written confirmation the opt-out is applied to the tenant.
  compensating_control: >
    Confirm training data is de-identified under the organisation's standard
    and that an attestation is on file.

- id: AIV-05
  question: >
    Is the retention period for prompts, outputs, and AI-derived records
    documented and bounded?
  frameworks:
    - { name: "NIST SP 800-53", id: "SI-12" }
    - { name: "NIST SP 800-53", id: "AU-11" }
    - { name: "SOC 2 TSC", id: "C1.1" }
  fails_when:
    - field: retention_days
      gt: 365
  gap_when:
    - field: retention_days
      is_unknown: true
  severity: medium
  remediation: >
    Obtain a documented retention schedule for AI prompts and outputs and
    confirm it aligns with the organisation's record retention policy.
  compensating_control: >
    Document the vendor's retention as an accepted deviation with Privacy sign-off.

- id: AIV-06
  question: >
    Is the AI feature's data reach limited to the minimum necessary for its
    stated purpose?
  frameworks:
    - { name: "NIST SP 800-53", id: "AC-6" }
    - { name: "SOC 2 TSC", id: "CC6.1" }
  fails_when:
    - field: data_reach
      contains_any: [clinical_documentation, encounter_records]
    - field: autonomy
      equals: acts
  severity: high
  remediation: >
    Scope the AI feature away from regulated record types, or require per-action
    approval before it reads or writes those records.
  compensating_control: >
    Restrict the feature to a named pilot group with enhanced monitoring.

- id: AIV-07
  question: >
    Does any vendor agent take autonomous action on production records
    (identity, customer, or clinical) without human review?
  frameworks:
    - { name: "NIST SP 800-53", id: "AC-3" }
    - { name: "NIST SP 800-53", id: "AC-6" }
    - { name: "SOC 2 TSC", id: "CC6.1" }
    - { name: "SOC 2 TSC", id: "CC6.3" }
  fails_when:
    - field: autonomy
      equals: acts
    - field: human_in_loop
      equals: false
  severity: critical
  remediation: >
    Disable autonomous action mode until per-action human approval is available,
    or restrict the agent to a read-only scope.
  compensating_control: >
    Scope the agent to non-privileged groups and alert on every agent-attributed
    write in the SIEM within one business day.

- id: AIV-08
  question: >
    Are AI feature actions and outputs written to an auditable log the customer
    can export?
  frameworks:
    - { name: "NIST SP 800-53", id: "AU-2" }
    - { name: "NIST SP 800-53", id: "AU-12" }
    - { name: "SOC 2 TSC", id: "CC7.2" }
  fails_when:
    - field: output_logged
      equals: false
  gap_when:
    - field: output_logged
      is_unknown: true
  severity: high
  remediation: >
    Require exportable audit logging of AI actions attributable to the agent
    principal, retained per the organisation's log retention standard.
  compensating_control: >
    Ingest whatever vendor telemetry exists into the SIEM and alert on gaps.

- id: AIV-09
  question: >
    Does the vendor notify customers of material model or model-version changes
    before they take effect?
  frameworks:
    - { name: "NIST SP 800-53", id: "CM-3" }
    - { name: "NIST SP 800-53", id: "SA-9" }
    - { name: "SOC 2 TSC", id: "CC8.1" }
  fails_when:
    - field: change_notification
      in: [none, release_notes_only]
  severity: medium
  remediation: >
    Require advance written notice of material model changes, with a defined
    notice period, added to the AI addendum.
  compensating_control: >
    Monitor the vendor changelog and trust center continuously — which is what
    this tool does — and treat detection as compensating detective control.

- id: AIV-10
  question: >
    Has the vendor disclosed error, accuracy, or hallucination rates for AI
    features that influence operational or financial decisions?
  frameworks:
    - { name: "NIST SP 800-53", id: "SI-10" }
    - { name: "NIST SP 800-53", id: "SA-11" }
    - { name: "SOC 2 TSC", id: "CC7.1" }
  fails_when:
    - field: error_rate_disclosed
      equals: false
  gap_when:
    - field: error_rate_disclosed
      is_unknown: true
  severity: medium
  remediation: >
    Request the vendor's accuracy validation methodology and current metrics,
    under NDA if required, and review before expanding use.
  compensating_control: >
    Sample and review AI outputs internally at a defined rate; track override rate.

- id: AIV-11
  question: >
    Has the vendor tested AI features against prompt injection and adversarial
    input, and will it share results?
  frameworks:
    - { name: "NIST SP 800-53", id: "SI-10" }
    - { name: "NIST SP 800-53", id: "SA-11" }
    - { name: "SOC 2 TSC", id: "CC7.1" }
    - { name: "OWASP LLM Top 10", id: "LLM01" }
  fails_when:
    - field: prompt_injection_tested
      equals: false
  gap_when:
    - field: prompt_injection_tested
      is_unknown: true
  severity: high
  remediation: >
    Obtain a summary of adversarial testing scope and findings, or an
    independent assessment, before the feature is granted write access.
  compensating_control: >
    Restrict agent write scopes and require human approval on privileged actions.

- id: AIV-12
  question: >
    Is AI inference performed within the contracted data residency boundary?
  frameworks:
    - { name: "NIST SP 800-53", id: "SC-28" }
    - { name: "NIST SP 800-53", id: "SA-9" }
    - { name: "SOC 2 TSC", id: "CC6.7" }
  fails_when:
    - field: data_residency
      in: [offshore, undisclosed]
  gap_when:
    - field: data_residency
      is_unknown: true
  severity: high
  remediation: >
    Obtain written confirmation that inference, logging, and abuse-monitoring
    all occur within the contracted region.
  compensating_control: >
    Pin the tenant to a compliant region and verify via vendor attestation.

- id: AIV-13
  question: >
    Has the vendor performed bias or performance testing across the populations
    the feature will affect?
  frameworks:
    - { name: "NIST SP 800-53", id: "SA-11" }
    - { name: "NIST SP 800-53", id: "SI-10" }
    - { name: "SOC 2 TSC", id: "CC7.1" }
  fails_when:
    - field: bias_tested_clinical
      equals: false
  gap_when:
    - field: bias_tested_clinical
      is_unknown: true
  applies_when:
    - field: data_reach
      contains_any: [clinical_documentation, encounter_records, claims]
  severity: high
  remediation: >
    Request subgroup performance analysis for the populations the feature
    will affect before expanding use.
  compensating_control: >
    Monitor internal override rates by service line and escalate disparities.

- id: AIV-14
  question: >
    Does the vendor have an AI-specific incident response process covering model
    failure, harmful output, and agent misuse?
  frameworks:
    - { name: "NIST SP 800-53", id: "IR-4" }
    - { name: "NIST SP 800-53", id: "IR-6" }
    - { name: "SOC 2 TSC", id: "CC7.3" }
    - { name: "SOC 2 TSC", id: "CC7.4" }
  fails_when:
    - field: ai_incident_process
      equals: false
  gap_when:
    - field: ai_incident_process
      is_unknown: true
  severity: medium
  remediation: >
    Require an AI incident process with defined notification triggers and a
    contact path, incorporated into the existing incident response addendum.
  compensating_control: >
    Extend the organisation's own IR runbook to cover vendor AI failure modes.

- id: AIV-15
  question: >
    Can the customer disable the AI feature entirely at tenant level?
  frameworks:
    - { name: "NIST SP 800-53", id: "CM-7" }
    - { name: "NIST SP 800-53", id: "AC-3" }
    - { name: "SOC 2 TSC", id: "CC6.3" }
  fails_when:
    - field: customer_disableable
      equals: false
  gap_when:
    - field: customer_disableable
      is_unknown: true
  severity: medium
  remediation: >
    Confirm and document the tenant-level kill switch and who holds authority to
    use it.
  compensating_control: >
    Document a vendor-side disablement request path with an agreed SLA.
