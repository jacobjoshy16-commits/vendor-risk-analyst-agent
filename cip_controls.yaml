# NERC CIP control set — substation supply-chain and access management.
#
# This file cites NERC Reliability Standards and NOTHING ELSE. No NIST SP
# 800-53, no SOC 2 TSC. A utility compliance lead is audited against NERC; a
# control that cites three frameworks to say one thing is longer to read and
# no more defensible. The AIV-* and NHI-* sets in controls.yaml /
# nhi_controls.yaml keep their 800-53 + SOC 2 citations and are unaffected.
#
# ---------------------------------------------------------------------------
# WHAT EACH STANDARD ACTUALLY DOES (this mapping is the point of the file)
# ---------------------------------------------------------------------------
#
#   SCOPE NOTE: CIP-013-2 R1 applies to high and medium impact BES Cyber Systems
#   AND their associated EACMS and PACS. The applies_when gates in this file key
#   off the asset's impact rating only; an estate model that distinguished EACMS
#   and PACS would scope these more precisely. Recorded as a known simplification.
#
#   CIP-013  Supply chain risk management. A PLAN standard: develop a plan
#            (R1), implement it (R2), review and get CIP Senior Manager
#            approval every 15 calendar months (R3). CIP-013 does NOT impose
#            the per-installation firmware check. It requires that your
#            procurement PROCESS address it (R1.2.5).
#
#   CIP-010  Configuration change management. R1 Part 1.6 is the operational
#            control that actually requires verifying the identity of the
#            software source (1.6.1) and the integrity of the software
#            obtained (1.6.2) before deviating from baseline. THIS is the
#            requirement a firmware verification tool evidences.
#
#   CIP-005  Electronic Security Perimeter. R2.4 requires methods for
#            DETERMINING active vendor remote access sessions; R2.5 requires
#            methods to DISABLE them. CIP-013 R1.2.6 requires your plan to
#            address coordination of these controls — the technical control
#            itself lives here.
#
#   CIP-004  Personnel and training. Governs WHO may hold the access that
#            CIP-005 perimeters: training (R2), personnel risk assessment
#            (R3), access authorization and periodic verification (R4),
#            access revocation (R5).
#
#   CIP-002  Not encoded as controls. Its output — the High / Medium / Low
#            BES Cyber System impact rating — is carried on every asset and
#            drives `applies_when`. CIP-013 obligations attach to high and
#            medium impact BES Cyber Systems; applying them to a low-impact
#            substation is a false positive an auditor will catch.
#
# ---------------------------------------------------------------------------
# CITATION VERIFICATION
# ---------------------------------------------------------------------------
#
# CIP-010 — CHECKED 2026-09-21, AND IT HAS AN EXPIRY DATE
#
# The six CIP-010 controls (CIP-01 … CIP-06) are the ones the demo exercises, so
# they were verified first against NERC's published standards listing:
#
#   CIP-010-4  mandatory and subject to enforcement  -> what this file cites
#   CIP-010-5  subject to FUTURE enforcement
#
# CIP-010-5 comes from Project 2016-02 (virtualization), approved by FERC in
# Order No. 919. That order is effective 2026-05-26, and the standards take
# effect the first day of the first calendar quarter 24 months later:
# 2028-04-01.
#
# THE PART NUMBER MOVES AT THAT TRANSITION. The software integrity requirement
# cited here as CIP-010-4 R1 Part 1.6 is carried into CIP-010-5 as R1 Part 1.3.
# A citation reading "Part 1.6" after 2028-04-01 is citing a superseded
# revision — which is precisely the failure this flag exists to prevent.
#
# So a verified citation is not permanently verified. Those six frameworks
# carry `enforceable_until` and `superseded_by`, and src/vra/cip.py re-checks
# them against the assessment date on every run: a warning inside a year of the
# sunset, an error past it. Verification is a fact with a shelf life, and the
# tool tracks the shelf life rather than trusting a one-time check.
#
# The remaining 28 citations are still unverified and still print a banner.
#
# ---------------------------------------------------------------------------
# NERC revises these standards and part numbering shifts between revisions.
# Every control therefore carries an explicit, pinned `standard` + `version` +
# `requirement` + `part`, plus `citation_verified`. Until a human checks each
# citation against the enforceable standard on nerc.com and sets
# `citation_verified: true` with their name, the audit evidence pack prints a
# prominent UNVERIFIED banner. The tool does not silently assert a revision
# number it cannot check. tests/test_cip_controls.py enforces that the fields
# are present on every control.
#
# ---------------------------------------------------------------------------
# EVALUATION SEMANTICS — identical to controls.yaml (src/vra/evaluate.py)
# ---------------------------------------------------------------------------
#   applies_when: ALL must hold or the control is skipped entirely
#   fails_when:   ALL must hold (AND) for the control to FAIL
#   gap_when:     ANY holds and the control did not fail -> information gap
#   severity:     from this file only. The model never sets it.
#   subject:      which collection the control is evaluated against —
#                 procurement | firmware_deployment | vendor_access |
#                 vendor_personnel
#
# Boolean verification fields (signature_verified, integrity_verified, ...)
# are NOT typed into YAML. They are computed by src/vra/cipcrypto.py performing
# real Ed25519 signature verification and real SHA-256 hashing against the
# actual firmware bytes on disk, then materialised onto the subject. A finding
# here traces to a cryptographic operation, not to a field somebody asserted.

# ===========================================================================
# CIP-010 R1.6 — software source identity and software integrity
# The load-bearing technical controls. These are what the demo performs.
# ===========================================================================

- id: CIP-01
  subject: firmware_deployment
  question: >
    Was the integrity of the firmware obtained from the software source verified
    before it was deployed to the BES Cyber Asset?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-010"
      version: "4"
      # VERIFIED 2026-09-21 against NERC's standards listing: CIP-010-4 is
      # mandatory and subject to enforcement; CIP-010-5 is listed as subject to
      # FUTURE enforcement. FERC Order No. 919 (approving the Project 2016-02
      # virtualization standards) is effective 2026-05-26, and the standards
      # become effective the first day of the first calendar quarter 24 months
      # later — 2028-04-01. So this citation is correct today and has a known
      # expiry.
      #
      # The part number MOVES at that transition: CIP-010-4 R1 Part 1.6 is
      # carried into CIP-010-5 as R1 Part 1.3. Anything citing "Part 1.6" after
      # 2028-04-01 is citing a superseded revision.
      superseded_by: "CIP-010-5"
      enforceable_until: "2028-03-31"
      requirement: "R1"
      part: "1.6.2"
      text: "Verify the integrity of the software obtained from the software source."
      citation_verified: true
      citation_verified_by: "nerc.com standards listing, checked 2026-09-21"
  applies_when:
    - field: impact_rating
      in: [high, medium]
    - field: verification_method_available
      equals: true
  fails_when:
    - field: integrity_verified
      equals: false
  gap_when:
    - field: integrity_verified
      is_unknown: true
  severity: critical
  remediation: >
    Do not deploy. Quarantine the binary, re-obtain the package from the vendor's
    authenticated distribution channel, and re-run verification. If the device was
    already flashed, treat it as a potential compromise of the BES Cyber Asset and
    initiate the CIP-008 incident response process.
  compensating_control: >
    Isolate the affected asset from the Electronic Security Perimeter and revert to
    the last baseline-verified firmware image pending investigation.

- id: CIP-02
  subject: firmware_deployment
  question: >
    Was the identity of the software source verified before the firmware was
    deployed to the BES Cyber Asset?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-010"
      version: "4"
      # VERIFIED 2026-09-21 against NERC's standards listing: CIP-010-4 is
      # mandatory and subject to enforcement; CIP-010-5 is listed as subject to
      # FUTURE enforcement. FERC Order No. 919 (approving the Project 2016-02
      # virtualization standards) is effective 2026-05-26, and the standards
      # become effective the first day of the first calendar quarter 24 months
      # later — 2028-04-01. So this citation is correct today and has a known
      # expiry.
      #
      # The part number MOVES at that transition: CIP-010-4 R1 Part 1.6 is
      # carried into CIP-010-5 as R1 Part 1.3. Anything citing "Part 1.6" after
      # 2028-04-01 is citing a superseded revision.
      superseded_by: "CIP-010-5"
      enforceable_until: "2028-03-31"
      requirement: "R1"
      part: "1.6.1"
      text: "Verify the identity of the software source."
      citation_verified: true
      citation_verified_by: "nerc.com standards listing, checked 2026-09-21"
  applies_when:
    - field: impact_rating
      in: [high, medium]
    - field: verification_method_available
      equals: true
  fails_when:
    - field: source_identity_verified
      equals: false
  gap_when:
    - field: source_identity_verified
      is_unknown: true
  severity: critical
  remediation: >
    Do not deploy. A package whose signature does not chain to a trusted vendor
    signing key has no verified source, regardless of where it was downloaded from
    or whether its published hash matches. Re-obtain from the vendor and confirm the
    signing key fingerprint out of band.
  compensating_control: >
    Hold the package in quarantine and request the vendor re-publish with a current
    signing key and a fingerprint confirmed through a separate channel.

- id: CIP-03
  subject: firmware_deployment
  question: >
    Is the firmware signed by a vendor key that is currently trusted — neither
    revoked nor outside its validity window?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-010"
      version: "4"
      # VERIFIED 2026-09-21 against NERC's standards listing: CIP-010-4 is
      # mandatory and subject to enforcement; CIP-010-5 is listed as subject to
      # FUTURE enforcement. FERC Order No. 919 (approving the Project 2016-02
      # virtualization standards) is effective 2026-05-26, and the standards
      # become effective the first day of the first calendar quarter 24 months
      # later — 2028-04-01. So this citation is correct today and has a known
      # expiry.
      #
      # The part number MOVES at that transition: CIP-010-4 R1 Part 1.6 is
      # carried into CIP-010-5 as R1 Part 1.3. Anything citing "Part 1.6" after
      # 2028-04-01 is citing a superseded revision.
      superseded_by: "CIP-010-5"
      enforceable_until: "2028-03-31"
      requirement: "R1"
      part: "1.6.1"
      text: "Verify the identity of the software source."
      citation_verified: true
      citation_verified_by: "nerc.com standards listing, checked 2026-09-21"
  applies_when:
    - field: impact_rating
      in: [high, medium]
    - field: signature_present
      equals: true
  fails_when:
    - field: signing_key_trusted
      equals: false
  gap_when:
    - field: signing_key_status
      is_unknown: true
  severity: critical
  remediation: >
    Reject the package. A mathematically valid signature from a revoked or expired
    key does not establish source identity. Obtain a build signed by the vendor's
    current key.
  compensating_control: >
    Where the vendor cannot re-sign, document a risk acceptance approved by the CIP
    Senior Manager and verify the package through an independent vendor-confirmed
    hash before deployment.

- id: CIP-04
  subject: firmware_deployment
  question: >
    Does the firmware package match the hash the vendor published for that release?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-010"
      version: "4"
      # VERIFIED 2026-09-21 against NERC's standards listing: CIP-010-4 is
      # mandatory and subject to enforcement; CIP-010-5 is listed as subject to
      # FUTURE enforcement. FERC Order No. 919 (approving the Project 2016-02
      # virtualization standards) is effective 2026-05-26, and the standards
      # become effective the first day of the first calendar quarter 24 months
      # later — 2028-04-01. So this citation is correct today and has a known
      # expiry.
      #
      # The part number MOVES at that transition: CIP-010-4 R1 Part 1.6 is
      # carried into CIP-010-5 as R1 Part 1.3. Anything citing "Part 1.6" after
      # 2028-04-01 is citing a superseded revision.
      superseded_by: "CIP-010-5"
      enforceable_until: "2028-03-31"
      requirement: "R1"
      part: "1.6.2"
      text: "Verify the integrity of the software obtained from the software source."
      citation_verified: true
      citation_verified_by: "nerc.com standards listing, checked 2026-09-21"
  applies_when:
    - field: impact_rating
      in: [high, medium]
    - field: published_hash_available
      equals: true
  fails_when:
    - field: hash_match
      equals: false
  gap_when:
    - field: hash_match
      is_unknown: true
  severity: critical
  remediation: >
    Reject the package and re-download. A hash mismatch means the bytes on disk are
    not the bytes the vendor released — corruption in transit at best, substitution
    at worst.
  compensating_control: >
    None. A hash mismatch is not compensable; the package must be re-obtained.

- id: CIP-05
  subject: firmware_deployment
  question: >
    Is the firmware package built for the device model it is being deployed to?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-010"
      version: "4"
      # VERIFIED 2026-09-21 against NERC's standards listing: CIP-010-4 is
      # mandatory and subject to enforcement; CIP-010-5 is listed as subject to
      # FUTURE enforcement. FERC Order No. 919 (approving the Project 2016-02
      # virtualization standards) is effective 2026-05-26, and the standards
      # become effective the first day of the first calendar quarter 24 months
      # later — 2028-04-01. So this citation is correct today and has a known
      # expiry.
      #
      # The part number MOVES at that transition: CIP-010-4 R1 Part 1.6 is
      # carried into CIP-010-5 as R1 Part 1.3. Anything citing "Part 1.6" after
      # 2028-04-01 is citing a superseded revision.
      superseded_by: "CIP-010-5"
      enforceable_until: "2028-03-31"
      requirement: "R1"
      part: "1.1"
      text: >
        Develop a baseline configuration, individually or by group, which shall
        include operating system or firmware.
      citation_verified: true
      citation_verified_by: "nerc.com standards listing, checked 2026-09-21"
  applies_when:
    - field: impact_rating
      in: [high, medium]
  fails_when:
    - field: model_match
      equals: false
  gap_when:
    - field: target_model
      is_unknown: true
  severity: high
  remediation: >
    Do not deploy. Correctly signed firmware for the wrong relay family can render a
    protective device inoperable. Obtain the build matching the deployed model and
    firmware family.
  compensating_control: >
    Stage the deployment on a bench unit of the same model before any field rollout.

- id: CIP-06
  subject: firmware_deployment
  question: >
    Where the vendor supplies no verification method, has the absence been recorded
    and risk-accepted rather than silently passed?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-010"
      version: "4"
      # VERIFIED 2026-09-21 against NERC's standards listing: CIP-010-4 is
      # mandatory and subject to enforcement; CIP-010-5 is listed as subject to
      # FUTURE enforcement. FERC Order No. 919 (approving the Project 2016-02
      # virtualization standards) is effective 2026-05-26, and the standards
      # become effective the first day of the first calendar quarter 24 months
      # later — 2028-04-01. So this citation is correct today and has a known
      # expiry.
      #
      # The part number MOVES at that transition: CIP-010-4 R1 Part 1.6 is
      # carried into CIP-010-5 as R1 Part 1.3. Anything citing "Part 1.6" after
      # 2028-04-01 is citing a superseded revision.
      superseded_by: "CIP-010-5"
      enforceable_until: "2028-03-31"
      requirement: "R1"
      part: "1.6"
      text: >
        ... and when the method to do so is available to the Responsible Entity from
        the software source.
      citation_verified: true
      citation_verified_by: "nerc.com standards listing, checked 2026-09-21"
  applies_when:
    - field: impact_rating
      in: [high, medium]
    - field: verification_method_available
      equals: false
  fails_when:
    - field: no_verification_method_documented
      equals: false
  severity: high
  remediation: >
    CIP-010 R1.6 is conditioned on the method being available from the source, but
    the absence must be documented, not assumed. Record which method is unavailable,
    for which vendor and product, and route it to procurement as a CIP-013 R1.2.5
    contract gap.
  compensating_control: >
    Obtain an out-of-band hash or signature from the vendor and record the channel
    used to confirm it.

# ===========================================================================
# CIP-013 R1.1 / R1.2 — the procurement plan layer
# One subject per vendor. These are contract and process controls, not
# per-deployment technical checks.
# ===========================================================================

- id: CIP-07
  subject: procurement
  question: >
    Does a documented process exist to identify and assess cyber security risk from
    vendor products and services, including installing vendor equipment and software
    and transitions between vendors?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-013"
      version: "2"
      requirement: "R1"
      part: "1.1"
      text: >
        One or more process(es) used in planning for the procurement of BES Cyber
        Systems to identify and assess cyber security risk(s) to the Bulk Electric
        System from vendor products or services resulting from: (i) procuring and
        installing vendor equipment and software; and (ii) transitions from one
        vendor(s) to another vendor(s).
      citation_verified: true
      citation_verified_by: "nerc.com CIP-013-2 standard text, checked 2026-09-21"
  applies_when:
    - field: supplies_impact_rating
      in: [high, medium]
  fails_when:
    - field: risk_assessment_process_documented
      equals: false
  gap_when:
    - field: risk_assessment_process_documented
      is_unknown: true
  severity: high
  remediation: >
    Document the procurement risk assessment process covering equipment and software
    installation and vendor transition, and record its application to this vendor
    with a dated assessment.
  compensating_control: >
    Perform and record a point-in-time risk assessment for this vendor while the
    standing process is being formalised.

- id: CIP-08
  subject: procurement
  question: >
    Does the procurement contract require the vendor to notify the entity of
    vendor-identified incidents related to the products or services supplied?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-013"
      version: "2"
      requirement: "R1"
      part: "1.2.1"
      text: >
        Notification by the vendor of vendor-identified incidents related to the
        products or services provided to the Responsible Entity that pose cyber
        security risk to the Responsible Entity.
      citation_verified: true
      citation_verified_by: "nerc.com CIP-013-2 standard text, checked 2026-09-21"
  applies_when:
    - field: supplies_impact_rating
      in: [high, medium]
  fails_when:
    - field: contract.incident_notification_clause
      equals: false
  gap_when:
    - field: contract.incident_notification_clause
      is_unknown: true
  severity: high
  remediation: >
    Add a vendor incident notification clause with a defined notification window at
    the next contract renewal or amendment.
  compensating_control: >
    Subscribe to the vendor's published security advisory feed and monitor E-ISAC
    bulletins naming this vendor until the clause is executed.

- id: CIP-09
  subject: procurement
  question: >
    Does the contract establish coordinated response to vendor-identified incidents?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-013"
      version: "2"
      requirement: "R1"
      part: "1.2.2"
      text: >
        Coordination of responses to vendor-identified incidents related to the
        products or services provided to the Responsible Entity that pose cyber
        security risk to the Responsible Entity.
      citation_verified: true
      citation_verified_by: "nerc.com CIP-013-2 standard text, checked 2026-09-21"
  applies_when:
    - field: supplies_impact_rating
      in: [high, medium]
  fails_when:
    - field: contract.incident_coordination_clause
      equals: false
  gap_when:
    - field: contract.incident_coordination_clause
      is_unknown: true
  severity: medium
  remediation: >
    Define named contacts, escalation paths and response obligations for coordinated
    incident handling with this vendor, and reference them in the contract.
  compensating_control: >
    Record the vendor's published incident contact and escalation path in the
    CIP-008 incident response plan.

- id: CIP-10
  subject: procurement
  question: >
    Does the contract require the vendor to notify the entity when vendor remote or
    onsite access should no longer be granted to a vendor representative?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-013"
      version: "2"
      requirement: "R1"
      part: "1.2.3"
      text: >
        Notification by vendors when remote or onsite access should no longer be
        granted to vendor representatives.
      citation_verified: true
      citation_verified_by: "nerc.com CIP-013-2 standard text, checked 2026-09-21"
  applies_when:
    - field: supplies_impact_rating
      in: [high, medium]
  fails_when:
    - field: contract.access_termination_notice_clause
      equals: false
  gap_when:
    - field: contract.access_termination_notice_clause
      is_unknown: true
  severity: high
  remediation: >
    Require written notice when a vendor representative leaves the engagement, with
    a defined notification window, and bind it to the CIP-004 R5 revocation process.
  compensating_control: >
    Re-attest the vendor's authorised representative roster at least quarterly until
    the notification clause is executed.

- id: CIP-11
  subject: procurement
  question: >
    Does the contract require vendor disclosure of known vulnerabilities in the
    products or services provided?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-013"
      version: "2"
      requirement: "R1"
      part: "1.2.4"
      text: >
        Disclosure by vendors of known vulnerabilities related to the products or
        services provided to the Responsible Entity.
      citation_verified: false
      citation_verified_by: ""
  applies_when:
    - field: supplies_impact_rating
      in: [high, medium]
  fails_when:
    - field: contract.vulnerability_disclosure_clause
      equals: false
  gap_when:
    - field: contract.vulnerability_disclosure_clause
      is_unknown: true
  severity: high
  remediation: >
    Add a vulnerability disclosure obligation with a defined disclosure window and a
    machine-readable advisory channel.
  compensating_control: >
    Track the vendor's products in the NERC E-ISAC and CISA ICS advisory feeds and
    review at least monthly.

- id: CIP-12
  subject: procurement
  question: >
    Does the contract require the vendor to provide a method to verify software
    integrity and authenticity for all software and patches supplied?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-013"
      version: "2"
      requirement: "R1"
      part: "1.2.5"
      text: >
        Verification of software integrity and authenticity of all software and
        patches provided by the vendor for use in the BES Cyber System.
      # NERC's technical rationale is explicit that Part 1.2.5 is NOT an
      # operational requirement for the entity to perform verification. It is
      # aimed at identifying, during procurement, the vendor's CAPABILITY to
      # provide software integrity and authenticity assurance. The operational
      # check belongs to CIP-010 R1.6. This is the split the whole control set
      # is built on, and it is confirmed by the standard's own rationale.
      note: "procurement-phase capability check; the operational check is CIP-010 R1.6"
      citation_verified: true
      citation_verified_by: "nerc.com CIP-013-2 standard text, checked 2026-09-21"
  applies_when:
    - field: supplies_impact_rating
      in: [high, medium]
  fails_when:
    - field: contract.software_integrity_clause
      equals: false
  gap_when:
    - field: contract.software_integrity_clause
      is_unknown: true
  severity: critical
  remediation: >
    Require the vendor to publish a code signing certificate or public key and a
    per-release signature or hash for every software and firmware artifact, with the
    key fingerprint confirmed out of band. This clause is what makes CIP-010 R1.6
    operable for this vendor.
  compensating_control: >
    Obtain per-release hashes through a vendor-confirmed out-of-band channel and
    record the channel in the deployment evidence.

- id: CIP-13
  subject: procurement
  question: >
    Does the contract establish coordinated controls for vendor-initiated
    Interactive Remote Access and system-to-system remote access?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-013"
      version: "2"
      requirement: "R1"
      part: "1.2.6"
      text: >
        Coordination of controls for (i) vendor-initiated Interactive Remote Access,
        and (ii) system-to-system remote access with a vendor(s).
      citation_verified: true
      citation_verified_by: "nerc.com CIP-013-2 standard text, checked 2026-09-21"
  applies_when:
    - field: supplies_impact_rating
      in: [high, medium]
  fails_when:
    - field: contract.remote_access_coordination_clause
      equals: false
  gap_when:
    - field: contract.remote_access_coordination_clause
      is_unknown: true
  severity: high
  remediation: >
    Define, in contract, how vendor-initiated Interactive Remote Access and
    system-to-system access are requested, approved, monitored and terminated, and
    bind it to the CIP-005 R2.4 / R2.5 technical controls.
  compensating_control: >
    Require all vendor remote access to transit the entity's Intermediate System
    with session recording until the clause is executed.

- id: CIP-14
  subject: procurement
  question: >
    Has the supply chain cyber security risk management plan been implemented for
    this vendor — that is, are the procured obligations evidenced in practice and
    not only in contract?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-013"
      version: "2"
      requirement: "R2"
      part: "R2"
      text: >
