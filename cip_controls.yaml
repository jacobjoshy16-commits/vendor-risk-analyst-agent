# ===========================================================================
# CIP-005 R2.4 / R2.5 — vendor remote access into the ESP
# ===========================================================================

- id: CIP-16
  subject: vendor_access
  question: >
    Does a method exist to determine that this vendor remote access session is
    active?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-005"
      version: "7"
      requirement: "R2"
      part: "2.4"
      text: >
        Have one or more methods for determining active vendor remote access
        sessions (including Interactive Remote Access and system-to-system remote
        access).
      citation_verified: true
      citation_verified_by: "CIP-005-7 R2 Parts 2.4/2.5 standard text, checked 2026-09-21"
  applies_when:
    - field: impact_rating
      in: [high, medium]
  fails_when:
    - field: session_visibility_method
      equals: false
  gap_when:
    - field: session_visibility_method
      is_unknown: true
  severity: high
  remediation: >
    Route vendor remote access through an Intermediate System that enumerates active
    sessions, and confirm the enumeration covers system-to-system access as well as
    Interactive Remote Access.
  compensating_control: >
    Enable session logging at the ESP boundary device and review active connections
    at the start and end of every approved maintenance window.

- id: CIP-17
  subject: vendor_access
  question: >
    Does a method exist to disable this vendor remote access session?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-005"
      version: "7"
      requirement: "R2"
      part: "2.5"
      text: >
        Have one or more method(s) to disable active vendor remote access (including
        Interactive Remote Access and system-to-system remote access).
      citation_verified: true
      citation_verified_by: "CIP-005-7 R2 Parts 2.4/2.5 standard text, checked 2026-09-21"
  applies_when:
    - field: impact_rating
      in: [high, medium]
  fails_when:
    - field: session_disable_method
      equals: false
  gap_when:
    - field: session_disable_method
      is_unknown: true
  severity: critical
  remediation: >
    Establish and test a documented method to terminate vendor remote access — both
    interactive and system-to-system — and record the test result.
  compensating_control: >
    Maintain a manual ESP boundary rule change procedure with a named on-call owner
    and a tested time-to-disconnect.

- id: CIP-18
  subject: vendor_access
  question: >
    Is the vendor remote access session still active after its approved maintenance
    window closed?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-005"
      version: "7"
      requirement: "R2"
      part: "2.4"
      text: >
        Have one or more methods for determining active vendor remote access
        sessions (including Interactive Remote Access and system-to-system remote
        access).
      citation_verified: true
      citation_verified_by: "CIP-005-7 R2 Parts 2.4/2.5 standard text, checked 2026-09-21"
  applies_when:
    - field: impact_rating
      in: [high, medium]
    - field: status
      equals: active
  fails_when:
    - field: past_approved_window
      equals: true
  gap_when:
    - field: approved_window_end
      is_unknown: true
  severity: high
  remediation: >
    Terminate the session and determine why it outlived its approved window. Bind
    session lifetime to the change ticket so expiry is enforced rather than reviewed.
  compensating_control: >
    Alert the control room on any vendor session exceeding its approved window and
    require positive confirmation to extend.

# ===========================================================================
# CIP-004 — who may hold that access
# ===========================================================================

- id: CIP-19
  subject: vendor_personnel
  question: >
    Has a personnel risk assessment been completed for this vendor representative
    before authorised electronic access was granted?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-004"
      version: "7"
      # PARTIALLY VERIFIED 2026-09-21. The revision is right: NERC lists
      # CIP-004-7 as mandatory and subject to enforcement, with CIP-004-8
      # subject to FUTURE enforcement from 2028-07-01. The requirement-level
      # framing is confirmed too -- R3 personnel risk assessment program, R4
      # access management program with verification at least once each calendar
      # quarter, R5 access revocation program.
      #
      # NOT confirmed: the exact part numbers below and the thresholds they
      # carry (seven years, 24 hours, 30 days). Those live in the standard's
      # requirement tables, which were not read. Part-level precision is what an
      # auditor cites, so citation_verified stays false until someone reads the
      # table.
      superseded_by: "CIP-004-8"
      enforceable_until: "2028-06-30"
      requirement: "R3"
      part: "3.4"
      text: >
        Process to ensure that individuals with authorized electronic or authorized
        unescorted physical access have had a personnel risk assessment completed
        ... prior to being granted authorized electronic access ...
      citation_verified: false
      citation_verified_by: ""
  applies_when:
    - field: impact_rating
      in: [high, medium]
    - field: has_electronic_access
      equals: true
  fails_when:
    - field: pra_completed
      equals: false
  gap_when:
    - field: pra_completed
      is_unknown: true
  severity: critical
  remediation: >
    Revoke access until the personnel risk assessment is completed and recorded.
    Access granted before a completed PRA is a CIP-004 R3 violation on the day it
    was granted, not on the day it is discovered.
  compensating_control: >
    None for standing access. Escorted, logged, time-bounded access may be permitted
    under a documented exception.

