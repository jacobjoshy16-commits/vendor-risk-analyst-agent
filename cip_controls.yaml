# ===========================================================================
# CIP-013 — clause quality, vendor transition, and the crosswalk to CIP-010
#
# A clause that exists but commits the vendor to nothing is not a control. The
# controls above ask whether each R1.2 obligation is addressed at all; these ask
# whether it is addressed in a way that can actually be relied on, which is the
# distinction an auditor draws between a procurement process and a paragraph.
# ===========================================================================

- id: CIP-26
  subject: procurement
  question: >
    Does the vendor incident notification obligation specify a notification
    window, rather than requiring notice without a deadline?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-013"
      version: "2"
      requirement: "R1"
      part: "1.2.1"
      text: >
        Notification by the vendor of vendor-identified incidents related to the
        products or services provided to the Responsible Entity that pose cyber
        security risk to the Responsible Entity.
      citation_verified: true
      citation_verified_by: "nerc.com CIP-013-2 standard text, checked 2026-09-21"
  applies_when:
    - field: supplies_impact_rating
      in: [high, medium]
    - field: contract.incident_notification_clause
      equals: true
  fails_when:
    - field: contract.incident_notification_hours
      gt: 72
  gap_when:
    - field: contract.incident_notification_hours
      is_unknown: true
  severity: medium
  remediation: >
    Amend the notification clause to state a maximum notification window in hours
    from vendor awareness. "Prompt" and "without undue delay" are not enforceable
    at audit and give the entity no basis to measure vendor performance.
  compensating_control: >
    Track vendor notification latency against incidents on record and raise it at
    the contract review.

- id: CIP-27
  subject: procurement
  question: >
    Does the vulnerability disclosure obligation specify a disclosure window?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-013"
      version: "2"
      requirement: "R1"
      part: "1.2.4"
      text: >
        Disclosure by vendors of known vulnerabilities related to the products or
        services provided to the Responsible Entity.
      citation_verified: false
      citation_verified_by: ""
  applies_when:
    - field: supplies_impact_rating
      in: [high, medium]
    - field: contract.vulnerability_disclosure_clause
      equals: true
  fails_when:
    - field: contract.vulnerability_disclosure_days
      gt: 90
  gap_when:
    - field: contract.vulnerability_disclosure_days
      is_unknown: true
  severity: medium
  remediation: >
    Amend the disclosure clause to state a maximum disclosure window in days, with
    a shorter window or immediate notice where a vulnerability is being actively
    exploited.
  compensating_control: >
    Monitor the vendor's products in the E-ISAC and CISA ICS advisory feeds and
    compare against what the vendor disclosed directly.

- id: CIP-28
  subject: procurement
  question: >
    Does the procurement process address transition away from this vendor to
    another vendor?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-013"
      version: "2"
      requirement: "R1"
      part: "1.1"
      text: >
        ... to identify and assess cyber security risk(s) to the Bulk Electric
        System from vendor products or services resulting from: ... (ii)
        transitions from one vendor(s) to another vendor(s).
      citation_verified: true
      citation_verified_by: "nerc.com CIP-013-2 standard text, checked 2026-09-21"
  applies_when:
    - field: supplies_impact_rating
      in: [high, medium]
  fails_when:
    - field: contract.vendor_transition_clause
      equals: false
  gap_when:
    - field: contract.vendor_transition_clause
      is_unknown: true
  severity: medium
  remediation: >
    Secure transition assistance terms covering transfer of configuration
    baselines and the documentation needed to operate or replace the supplied
    equipment. R1.1 names vendor transition explicitly and it is the part most
    often omitted from a supply chain plan.
  compensating_control: >
    Maintain an independent copy of device configuration baselines so a vendor
    exit does not strand the assets.

- id: CIP-29
  subject: procurement
  question: >
    Is the vendor obliged to notify the entity before rotating, or upon
    compromise of, a code signing key?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-013"
      version: "2"
      requirement: "R1"
      part: "1.2.5"
      text: >
        Verification of software integrity and authenticity of all software and
        patches provided by the vendor for use in the BES Cyber System.
      # NERC's technical rationale is explicit that Part 1.2.5 is NOT an
      # operational requirement for the entity to perform verification. It is
      # aimed at identifying, during procurement, the vendor's CAPABILITY to
      # provide software integrity and authenticity assurance. The operational
      # check belongs to CIP-010 R1.6. This is the split the whole control set
      # is built on, and it is confirmed by the standard's own rationale.
      note: "procurement-phase capability check; the operational check is CIP-010 R1.6"
      citation_verified: true
      citation_verified_by: "nerc.com CIP-013-2 standard text, checked 2026-09-21"
  applies_when:
    - field: supplies_impact_rating
      in: [high, medium]
    - field: contract.software_integrity_clause
      equals: true
  fails_when:
    - field: contract.key_rotation_notice_clause
      equals: false
  gap_when:
    - field: contract.key_rotation_notice_clause
      is_unknown: true
  severity: high
  remediation: >
    Require advance notice of planned key rotation and immediate notice of key
    compromise. Without it, a rotated key makes every subsequent release fail
    source identity verification and the entity cannot distinguish that from an
    attack.
  compensating_control: >
    Subscribe to the vendor's security advisory feed and re-confirm the key
    fingerprint out of band whenever a signature unexpectedly fails to verify.

- id: CIP-30
  subject: procurement
  question: >
    Does the vendor actually publish a usable verification method, so that the
    CIP-013 R1.2.5 contract obligation is operable under CIP-010 R1.6?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-013"
      version: "2"
      requirement: "R2"
      part: "R2"
      text: >
        Each Responsible Entity shall implement its supply chain cyber security
        risk management plan(s) specified in Requirement R1.
      citation_verified: false
      citation_verified_by: ""
  applies_when:
    - field: supplies_impact_rating
      in: [high, medium]
    - field: contract.software_integrity_clause
      equals: true
  fails_when:
    - field: vendor_publishes_signing_key
      equals: false
  gap_when:
    - field: vendor_publishes_signing_key
      is_unknown: true
  severity: high
  remediation: >
    Obtain the vendor's current code signing public key, confirm its fingerprint
    out of band, and register it as trusted. A contract clause requiring a
    verification method that the entity has not actually obtained is an
    unimplemented plan under R2, and leaves CIP-010 R1.6.1 unevaluable for every
    release this vendor ships.
  compensating_control: >
    Obtain per-release hashes through a vendor-confirmed out-of-band channel and
    record the channel in the deployment evidence until the key is registered.

# ===========================================================================
# CIP-003-9 Attachment 1 Section 6 — LOW IMPACT vendor electronic remote access
#
# WHY THESE EXIST, AND WHY THE SCOPING ABOVE IS NOT THE WHOLE STORY
#
# Every control above is gated on `impact_rating in [high, medium]`, because
# CIP-013, CIP-010 R1.6 and CIP-005 R2 attach to high and medium impact BES
# Cyber Systems. That gate is correct for those standards and it is why ~89% of
# a real estate is reported not applicable rather than passing.
#
# It is NOT correct to conclude that low impact assets have no vendor supply
# chain obligations. CIP-003-9 Attachment 1 Section 6 requires that, for assets
# containing low impact BES Cyber Systems which ALLOW vendor electronic remote
# access, the Responsible Entity implement a process to mitigate the risks of
# that access — including determining active vendor sessions, disabling them,
# and detecting malicious communications.
#
# So the population for vendor remote access is larger than the population for
# CIP-013. A low impact distribution substation with a dial-in maintenance path
# to a vendor is in scope for Section 6 and out of scope for CIP-013, and a tool
# that reports it as simply "not applicable" is under-reporting.
#
# These controls apply ONLY to low impact assets that actually allow vendor
# electronic remote access. A low impact substation with no vendor access path
# is genuinely out of scope and is reported that way.
#
# CITATION CAUTION, SPECIFIC TO THIS BLOCK
# NERC Project 2023-04 has been developing CIP-003-A, which would supersede
# CIP-003-9. The sub-numbering within Attachment 1 Section 6 is therefore cited
# only as "Attachment 1 Section 6" rather than asserting part numbers that may
# have moved. Confirm the enforceable revision and the effective date before
# relying on this block.

- id: CIP-31
  subject: vendor_access
  question: >
    For this low impact asset that allows vendor electronic remote access, is a
    documented process in place to mitigate the risks of that access?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-003"
      version: "9"
      requirement: "R2"
      part: "Attachment 1 Section 6"
      # VERIFIED 2026-09-21: CIP-003-9 became enforceable 1 April 2026, adding
      # Attachment 1 Section 6, "Vendor Electronic Remote Access Security
      # Controls", for low impact BES Cyber Systems.
      #
      # TWO REQUIREMENTS ARE IN PLAY and this file cites the implementation one.
      # R1 Part 1.2.6 obliges the cyber security POLICY to address vendor
      # electronic remote access; R2 obliges implementation of the plans in
      # Attachment 1, which is where Section 6's controls live. These controls
      # score whether the controls exist and work, so R2 / Attachment 1 Section 6
      # is the right citation for them -- but a policy-level finding would cite
      # R1 Part 1.2.6 instead. Confirm which the audience expects.
      related_requirement: "R1 Part 1.2.6 (policy must address vendor electronic remote access)"
      text: >
        For assets containing low impact BES Cyber System(s) identified pursuant
        to CIP-002, that allow vendor electronic remote access, the Responsible
        Entity shall implement a process to mitigate risks associated with vendor
        electronic remote access.
      citation_verified: true
      citation_verified_by: "CIP-003-9 Attachment 1 Section 6; effective 2026-04-01, checked 2026-09-21"
  applies_when:
    - field: impact_rating
      equals: low
    - field: allows_vendor_electronic_remote_access
      equals: true
  fails_when:
    - field: low_impact_vendor_access_process
      equals: false
  gap_when:
    - field: low_impact_vendor_access_process
      is_unknown: true
  severity: high
  remediation: >
    Document and implement the process required by CIP-003-9 Attachment 1
    Section 6 for this asset. Low impact does not mean no obligation where vendor
    electronic remote access has been established.
  compensating_control: >
    Remove the vendor electronic remote access path until the process is
    documented. An asset that allows no vendor remote access is out of Section 6
    scope entirely.

- id: CIP-32
  subject: vendor_access
  question: >
    Is there a method to determine active vendor electronic remote access
    sessions to this low impact asset?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-003"
      version: "9"
      requirement: "R2"
      part: "Attachment 1 Section 6"
      # VERIFIED 2026-09-21: CIP-003-9 became enforceable 1 April 2026, adding
      # Attachment 1 Section 6, "Vendor Electronic Remote Access Security
      # Controls", for low impact BES Cyber Systems.
      #
      # TWO REQUIREMENTS ARE IN PLAY and this file cites the implementation one.
      # R1 Part 1.2.6 obliges the cyber security POLICY to address vendor
      # electronic remote access; R2 obliges implementation of the plans in
      # Attachment 1, which is where Section 6's controls live. These controls
      # score whether the controls exist and work, so R2 / Attachment 1 Section 6
      # is the right citation for them -- but a policy-level finding would cite
      # R1 Part 1.2.6 instead. Confirm which the audience expects.
      related_requirement: "R1 Part 1.2.6 (policy must address vendor electronic remote access)"
      text: >
        Process to mitigate risks associated with vendor electronic remote
        access, including determining active vendor electronic remote access
        sessions.
      citation_verified: true
      citation_verified_by: "CIP-003-9 Attachment 1 Section 6; effective 2026-04-01, checked 2026-09-21"
  applies_when:
    - field: impact_rating
      equals: low
    - field: allows_vendor_electronic_remote_access
      equals: true
  fails_when:
    - field: session_visibility_method
      equals: false
  gap_when:
    - field: session_visibility_method
      is_unknown: true
  severity: medium
  remediation: >
    Provide a means of enumerating active vendor sessions to this asset. The
    obligation is lighter than CIP-005 R2.4 for medium and high impact systems,
    but it is not absent.
  compensating_control: >
    Log connections at the access point and review them on a defined cadence.

- id: CIP-33
  subject: vendor_access
  question: >
    Is there a method to disable vendor electronic remote access to this low
    impact asset?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-003"
      version: "9"
      requirement: "R2"
      part: "Attachment 1 Section 6"
      # VERIFIED 2026-09-21: CIP-003-9 became enforceable 1 April 2026, adding
      # Attachment 1 Section 6, "Vendor Electronic Remote Access Security
      # Controls", for low impact BES Cyber Systems.
      #
      # TWO REQUIREMENTS ARE IN PLAY and this file cites the implementation one.
      # R1 Part 1.2.6 obliges the cyber security POLICY to address vendor
      # electronic remote access; R2 obliges implementation of the plans in
      # Attachment 1, which is where Section 6's controls live. These controls
      # score whether the controls exist and work, so R2 / Attachment 1 Section 6
      # is the right citation for them -- but a policy-level finding would cite
      # R1 Part 1.2.6 instead. Confirm which the audience expects.
      related_requirement: "R1 Part 1.2.6 (policy must address vendor electronic remote access)"
      text: >
        Process to mitigate risks associated with vendor electronic remote
        access, including disabling vendor electronic remote access.
      citation_verified: true
      citation_verified_by: "CIP-003-9 Attachment 1 Section 6; effective 2026-04-01, checked 2026-09-21"
  applies_when:
    - field: impact_rating
      equals: low
    - field: allows_vendor_electronic_remote_access
      equals: true
  fails_when:
    - field: session_disable_method
      equals: false
  gap_when:
    - field: session_disable_method
      is_unknown: true
  severity: high
  remediation: >
    Establish and test a documented method to terminate vendor electronic remote
    access to this asset, and record the test result.
  compensating_control: >
    Maintain a manual disconnection procedure with a named owner and a tested
    time-to-disconnect.

- id: CIP-34
  subject: vendor_access
  question: >
    Is there a method to detect malicious communications over this low impact
    asset's vendor electronic remote access path?
  frameworks:
    - name: "NERC CIP"
      standard: "CIP-003"
      version: "9"
      requirement: "R2"
      part: "Attachment 1 Section 6"
      # VERIFIED 2026-09-21: CIP-003-9 became enforceable 1 April 2026, adding
      # Attachment 1 Section 6, "Vendor Electronic Remote Access Security
      # Controls", for low impact BES Cyber Systems.
      #
      # TWO REQUIREMENTS ARE IN PLAY and this file cites the implementation one.
      # R1 Part 1.2.6 obliges the cyber security POLICY to address vendor
      # electronic remote access; R2 obliges implementation of the plans in
      # Attachment 1, which is where Section 6's controls live. These controls
      # score whether the controls exist and work, so R2 / Attachment 1 Section 6
      # is the right citation for them -- but a policy-level finding would cite
      # R1 Part 1.2.6 instead. Confirm which the audience expects.
      related_requirement: "R1 Part 1.2.6 (policy must address vendor electronic remote access)"
      text: >
        Process to mitigate risks associated with vendor electronic remote
        access, including detecting malicious communications.
      citation_verified: true
      citation_verified_by: "CIP-003-9 Attachment 1 Section 6; effective 2026-04-01, checked 2026-09-21"
  applies_when:
    - field: impact_rating
      equals: low
    - field: allows_vendor_electronic_remote_access
      equals: true
  fails_when:
    - field: malicious_comms_detection
      equals: false
  gap_when:
    - field: malicious_comms_detection
      is_unknown: true
  severity: medium
  remediation: >
    Apply detection to the vendor access path — at minimum logging and alerting
    on the access point, proportionate to a low impact asset.
  compensating_control: >
    Review vendor session logs against the approved change record after every
    maintenance window.
